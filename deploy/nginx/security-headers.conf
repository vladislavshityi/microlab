# Заголовки безопасности для страниц и статических файлов SPA.
# csp.conf генерируется при сборке образа (хеши встроенных скриптов index.html).
include /etc/nginx/snippets/csp.conf;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), serial=()" always;
add_header Strict-Transport-Security $hsts_header always;
