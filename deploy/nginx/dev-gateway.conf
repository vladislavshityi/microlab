# Dev-шлюз (только docker-compose.dev.yml): проксирует запросы с хоста к воркеру компиляции
# (порт 8081) и супервизору симуляции (порт 8082) во внутренних сетях.
worker_processes 1;
error_log stderr warn;
pid /var/run/nginx.pid;

events {
  worker_connections 256;
}

http {
  access_log off;
  server_tokens off;
  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path /var/cache/nginx/proxy_temp;

  # Имена сервисов разрешаются при запросе: шлюз стартует, даже если один из них ещё не готов.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Проверка готовности самого шлюза.
  server {
    listen 8080;
    location = /healthz {
      return 200 "ok\n";
    }
    location / {
      return 404;
    }
  }

  # 127.0.0.1:8081 → compiler:8080
  server {
    listen 8081;
    # Лимит тела с запасом на JSON-экранирование исходника (воркер проверяет точный лимит).
    client_max_body_size 2m;

    location / {
      set $compiler http://compiler:8080;
      proxy_pass $compiler;
      proxy_read_timeout 120s;
      proxy_http_version 1.1;
    }
  }

  # 127.0.0.1:8082 → simulator:8080 (WebSocket /sessions)
  server {
    listen 8082;
    client_max_body_size 1m;

    location = /healthz {
      set $simulator http://simulator:8080;
      proxy_pass $simulator;
      proxy_http_version 1.1;
    }

    location = /sessions {
      set $simulator http://simulator:8080;
      proxy_pass $simulator;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      # Длительность сессии ограничивает супервизор; keepalive-ping идёт каждые 20 с.
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_buffering off;
    }

    location / {
      return 404;
    }
  }
}
