# Общая часть сервера MicroLab: SPA, прокси API и WebSocket симуляции.

root /usr/share/nginx/html;

# Необязательная защита (basic auth): docker-compose.auth.yml монтирует сюда конфиг.
# Без смонтированных файлов шаблон ничего не подключает.
include /etc/nginx/microlab/auth/*.conf;

# Проверка живости контейнера nginx (healthcheck), без авторизации и логов.
location = /nginx-health {
  auth_basic off;
  access_log off;
  default_type text/plain;
  return 200 "ok\n";
}

# WebSocket событий симуляции: /api/v1/ws/projects/{id}/simulation.
location /api/v1/ws/ {
  include /etc/nginx/snippets/proxy.conf;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  # Сессия может длиться долго; время ограничивает сервис симуляции.
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
  proxy_buffering off;
  include /etc/nginx/snippets/security-headers-api.conf;
}

# REST API. Компиляция занимает до 90 с (таймаут API к воркеру).
location /api/ {
  include /etc/nginx/snippets/proxy.conf;
  proxy_set_header Connection "";
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
  # Скетч до 256 KiB и документ схемы с запасом на JSON-экранирование.
  client_max_body_size 2m;
  include /etc/nginx/snippets/security-headers-api.conf;
}

# Файлы сборки Vite с хешем в имени: кэшируются навсегда.
location /assets/ {
  try_files $uri =404;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  include /etc/nginx/snippets/security-headers.conf;
}

# index.html всегда перепроверяется, чтобы после обновления подгружались новые assets.
location = /index.html {
  add_header Cache-Control "no-cache" always;
  include /etc/nginx/snippets/security-headers.conf;
}

# SPA: неизвестные пути отдают index.html (маршрутизация в браузере).
location / {
  try_files $uri /index.html;
  add_header Cache-Control "no-cache" always;
  include /etc/nginx/snippets/security-headers.conf;
}
