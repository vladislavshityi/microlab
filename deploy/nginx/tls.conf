# Сервер HTTPS для развёртывания на сервере (подключается docker-compose.tls.yml вместо http.conf).
# Сертификат и ключ монтируются в /etc/nginx/tls (см. README, «Развёртывание на сервере»).

# HTTP: только перенаправление на HTTPS (и проверка живости контейнера).
server {
  listen 8080 default_server;
  server_name _;

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 8443 ssl default_server;
  http2 on;
  server_name _;

  ssl_certificate /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:microlab_tls:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  include /etc/nginx/snippets/app.conf;
}
