# MicroLab — основной конфиг nginx (образ nginxinc/nginx-unprivileged, процесс без root).
# Корневая ФС контейнера только для чтения: pid и временные файлы — в tmpfs /tmp.
worker_processes auto;
error_log stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  # В mime.types нет ttf (шрифт значков Monaco).
  types {
    font/ttf ttf;
  }
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format main escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request",'
    '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
    '"request_id":"$request_id","user_agent":"$http_user_agent"}';
  access_log /dev/stdout main;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  client_max_body_size 1m;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml font/ttf;

  # Встроенный DNS Docker: адрес api перечитывается, если контейнер API пересоздан.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream microlab_api {
    zone microlab_api 64k;
    server api:8000 resolve;
    keepalive 16;
  }

  # WebSocket: Connection: upgrade только для запросов с Upgrade; иначе пустой заголовок,
  # чтобы работал keepalive к upstream.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" "";
  }

  # HSTS отправляется только по HTTPS (конфиг TLS); в режиме HTTP значение пустое
  # и заголовок не добавляется.
  map $scheme $hsts_header {
    https "max-age=31536000";
    default "";
  }

  include /etc/nginx/conf.d/*.conf;
}
