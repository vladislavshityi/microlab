# Профиль сборки: копируется рядом с каждым sketch.ino перед компиляцией.
# Версии платформы и библиотек зафиксированы; кроме библиотек платформы arduino:avr
# доступна только перечисленная здесь библиотека Servo.
profiles:
  uno:
    fqbn: arduino:avr:uno
    platforms:
      - platform: arduino:avr (1.8.8)
    libraries:
      - Servo (1.3.0)

default_profile: uno
