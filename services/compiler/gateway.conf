# Dev-шлюз: проксирует запросы с хоста к воркеру компиляции во внутренней сети.
worker_processes 1;
error_log stderr warn;
pid /var/run/nginx.pid;

events {
  worker_connections 64;
}

http {
  access_log off;
  server_tokens off;
  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path /var/cache/nginx/proxy_temp;

  server {
    listen 8080;
    # Лимит тела с запасом на JSON-экранирование исходника (воркер проверяет точный лимит).
    client_max_body_size 2m;

    location / {
      proxy_pass http://compiler:8080;
      proxy_read_timeout 120s;
      proxy_http_version 1.1;
    }
  }
}
