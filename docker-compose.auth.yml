# Дополнение (необязательно): basic auth на весь сайт (кроме /nginx-health) поверх входа
# в приложении — дополнительный барьер для закрытых установок.
#
#   docker compose -f docker-compose.yml [-f docker-compose.tls.yml] -f docker-compose.auth.yml up -d
#
# MICROLAB_HTPASSWD_FILE — файл htpasswd на хосте (создание — README).

services:
  web:
    volumes:
      - ./deploy/nginx/basic-auth.conf:/etc/nginx/microlab/auth/basic-auth.conf:ro
      - ${MICROLAB_HTPASSWD_FILE:?задайте MICROLAB_HTPASSWD_FILE в .env}:/etc/nginx/microlab/htpasswd:ro
