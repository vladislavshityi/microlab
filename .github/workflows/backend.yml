name: backend

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/circuit-schema/**"
      - "services/compiler/**"
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - ".env.example"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/circuit-schema/**"
      - "services/compiler/**"
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - ".env.example"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        # Тот же образ, что в docker-compose.yml.
        image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: microlab
          POSTGRES_PASSWORD: microlab
          POSTGRES_DB: microlab
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U microlab -d microlab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    # Те же значения, что в .env.example (одноразовая база только для CI).
    env:
      MICROLAB_ENV: development
      MICROLAB_DATABASE_URL: postgresql+asyncpg://microlab:microlab@127.0.0.1:5433/microlab
      MICROLAB_LOG_LEVEL: INFO
      MICROLAB_LOG_FORMAT: json

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # action публикует только точные теги (плавающего v10 нет)
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Migrations (upgrade, drift check, downgrade, upgrade)
        run: >-
          uv run alembic upgrade head &&
          uv run alembic check &&
          uv run alembic downgrade base &&
          uv run alembic upgrade head

      - name: Seed dev-user (idempotent)
        run: >-
          uv run python -m microlab_api.scripts.seed_dev_user &&
          uv run python -m microlab_api.scripts.seed_dev_user

      - name: Tests
        run: uv run pytest

      - name: OpenAPI is up to date
        run: uv run python -m microlab_api.scripts.export_openapi --check

      - name: Generated circuit-schema models are up to date
        run: uv run python -m microlab_api.scripts.gen_circuit_schema --check

  compiler:
    # Образ воркера компиляции и интеграционные тесты API с реальным arduino-cli.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      MICROLAB_ENV: test
      # База не используется интеграционными тестами компилятора, но обязательна в настройках.
      MICROLAB_DATABASE_URL: postgresql+asyncpg://microlab:microlab@127.0.0.1:1/microlab
      MICROLAB_COMPILER_URL: http://127.0.0.1:8081
      # Недоступный воркер — ошибка, а не пропуск тестов.
      MICROLAB_REQUIRE_COMPILER: "1"
      MICROLAB_LOG_FORMAT: json
      # docker compose: dev-дополнение с шлюзом на 127.0.0.1:8081 (одноразовый пароль CI).
      COMPOSE_FILE: docker-compose.yml:docker-compose.dev.yml
      MICROLAB_POSTGRES_PASSWORD: microlab

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build compiler image
        uses: docker/build-push-action@v7.4.0
        with:
          context: services/compiler
          # Тег совпадает с image сервиса compiler в docker-compose.yml.
          tags: microlab-compiler:arduino-cli-1.5.1-avr-1.8.8
          load: true
          cache-from: type=gha,scope=compiler
          cache-to: type=gha,scope=compiler,mode=max

      - name: Start compiler (internal network + dev gateway)
        run: docker compose up -d --no-build --wait compiler compiler-gateway

      - name: Compiler has no network egress
        run: >-
          ! docker compose exec -T compiler python -c
          "import urllib.request; urllib.request.urlopen('https://downloads.arduino.cc', timeout=5)"

      - uses: astral-sh/setup-uv@v10.2.0  # action публикует только точные теги (плавающего v10 нет)
        with:
          version: "0.12.x"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --locked

      - name: Lint compiler worker
        working-directory: apps/api
        run: >-
          uv run ruff check ../../services/compiler &&
          uv run ruff format --check ../../services/compiler &&
          uv run mypy --strict ../../services/compiler/compile_worker.py

      - name: Compiler integration tests
        working-directory: apps/api
        run: uv run pytest -m compiler

      - name: Compiler logs
        if: failure()
        run: docker compose logs compiler compiler-gateway
