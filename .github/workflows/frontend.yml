name: frontend

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "apps/api/openapi.json"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".node-version"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "apps/api/openapi.json"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".node-version"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # 24 LTS — эталонная версия (.node-version); 26 — локальная версия для разработки.
        node: [24, 26]

    name: web (node ${{ matrix.node }})

    steps:
      - uses: actions/checkout@v7

      # Берёт версию pnpm из поля "packageManager" в package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generated API types are up to date
        run: pnpm --filter @microlab/web gen:api:check

      - name: Generated circuit-schema types are up to date
        run: pnpm --filter @microlab/circuit-schema gen:check

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Tests
        run: pnpm -r test

      - name: Build
        run: pnpm --filter @microlab/web build
