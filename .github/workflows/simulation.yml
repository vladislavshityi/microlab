name: simulation

on:
  push:
    branches: [main]
    paths:
      - "simulation/**"
      - "services/simulator/**"
      - "packages/circuit-schema/definitions/**"
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - ".github/workflows/simulation.yml"
  pull_request:
    paths:
      - "simulation/**"
      - "services/simulator/**"
      - "packages/circuit-schema/definitions/**"
      - "docker-compose.yml"
      - "docker-compose.dev.yml"
      - ".github/workflows/simulation.yml"

permissions:
  contents: read

concurrency:
  group: simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: simulation

    steps:
      - uses: actions/checkout@v7

      # Версия toolchain закреплена в simulation/rust-toolchain.toml (rustup ставит её автоматически).
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests (unit, conformance, reference circuits, worker protocol)
        run: cargo test --locked --release

      - name: Benchmark (simulated MHz)
        run: cargo run --locked --release -p avr-core --example bench -- 10

  simulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # docker compose: dev-дополнение с шлюзом на 127.0.0.1:8082 (одноразовые значения CI).
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.dev.yml
      MICROLAB_ENV: test
      MICROLAB_POSTGRES_PASSWORD: microlab

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build simulator image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: services/simulator/Dockerfile
          # Тег совпадает с image сервиса simulator в docker-compose.yml.
          tags: microlab-simulator:dev
          load: true
          cache-from: type=gha,scope=simulator
          cache-to: type=gha,scope=simulator,mode=max

      - name: Start simulator (internal network + dev gateway)
        run: docker compose up -d --no-build --wait simulator simulator-gateway

      - name: Simulator has no network egress
        run: >-
          ! docker compose exec -T simulator /opt/venv/bin/python -c
          "import socket; socket.create_connection(('1.1.1.1', 80), timeout=5)"

      - uses: astral-sh/setup-uv@v10.2.0  # action публикует только точные теги (плавающего v10 нет)
        with:
          version: "0.12.x"

      - name: Lint supervisor
        working-directory: services/simulator
        run: >-
          uvx ruff@0.13.3 check . &&
          uvx ruff@0.13.3 format --check . &&
          uv run --no-project --with websockets==17.1 --with mypy==1.18.2 mypy --strict supervisor.py

      - name: Supervisor integration tests (container via gateway)
        env:
          SIM_TEST_URL: ws://127.0.0.1:8082
        run: >-
          uv run --no-project --with websockets==17.1
          python -m unittest discover -s services/simulator/tests -v

      - name: Simulator logs
        if: failure()
        run: docker compose logs simulator simulator-gateway
