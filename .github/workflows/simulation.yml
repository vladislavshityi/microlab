name: simulation

on:
  push:
    branches: [main]
    paths:
      - "simulation/**"
      - "packages/circuit-schema/definitions/arduino-uno-r3.json"
      - ".github/workflows/simulation.yml"
  pull_request:
    paths:
      - "simulation/**"
      - "packages/circuit-schema/definitions/arduino-uno-r3.json"
      - ".github/workflows/simulation.yml"

permissions:
  contents: read

concurrency:
  group: simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: simulation

    steps:
      - uses: actions/checkout@v7

      # Версия toolchain закреплена в simulation/rust-toolchain.toml (rustup ставит её автоматически).
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests (unit, conformance, worker protocol)
        run: cargo test --locked --release

      - name: Benchmark (simulated MHz)
        run: cargo run --locked --release -p avr-core --example bench -- 10
