[project]
name = "microlab-api"
version = "0.1.0"
description = "MicroLab backend API (FastAPI)."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.0",
    "uvicorn>=0.54.0",
    "websockets==17.1",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "datamodel-code-generator==0.83.0",
    "jsonschema==4.26.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.uv]
required-version = ">=0.12,<0.13"
# Пересобирать установленный проект при изменении исходников. Нужно для non-editable
# установки (UV_NO_EDITABLE=1): на macOS editable-установка опирается на .pth-файл,
# который Python может пропустить, если у файла стоит флаг hidden.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/**/py.typed" }]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "ASYNC", "PT", "DTZ", "S", "T20", "PL",
]
ignore = [
    "PLR2004", # магические значения: HTTP-коды в тестах/обработчиках понятны без пояснений
    "RUF002", # комментарии и docstrings пишутся по-русски: кириллица — не «неоднозначные» символы
    "RUF003", # то же для комментариев
]

[tool.ruff.lint.isort]
# apps/api/alembic/ — директория миграций, а не пакет alembic.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/microlab_api/scripts/**" = ["T201"]
"alembic/versions/**" = ["N999"]
# Генерируется из JSON Schema: длинные строки описаний не переносятся.
"src/microlab_api/circuit_schema/generated/**" = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.13"
files = ["src", "tests", "alembic"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "compiler: интеграционные тесты с реальным воркером компиляции (нужен MICROLAB_COMPILER_URL)",
    "simulator: интеграционные тесты с реальным сервисом симуляции (нужен MICROLAB_SIMULATOR_URL)",
]
xfail_strict = true
filterwarnings = [
    "error",
    # TestClient (тесты WebSocket) пока работает поверх httpx; переход на httpx2 — отдельное изменение.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]
