[workspace]
resolver = "2"
members = ["avr-core", "circuit", "worker"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false

[profile.release]
# Эмулятор — горячий цикл: включаем LTO и один codegen unit ради стабильной производительности.
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.test]
# Conformance-тесты гоняют секунды симулированного времени — без оптимизаций они слишком медленные.
opt-level = 3
